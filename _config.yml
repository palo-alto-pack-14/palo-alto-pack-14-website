# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Cub Scouts Pack 14
email: info@paloaltopack14.org
cubmaster_email: info@paloaltopack14.org
description: >- # this means to ignore newlines until "baseurl:"
  Cub Scout Pack 14 of Palo Alto, California — serving local families for over 40 years.
  Fun, character-building adventures for K-5th grade youth through camping, Pinewood Derby,
  community service, and much more. We welcome families from PAUSD schools and beyond.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://paloaltopack14.org" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: jekyllrb
github_username:  jekyll
timezone: America/Los_Angeles

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-tailwindcss

# Scoutbook Plus .ics calendar feed(s), fetched at build time by
# _plugins/scoutbook_calendar.rb (no API key or service account needed —
# these are public iCal feed URLs from the pack's Scoutbook Plus calendar).
scoutbook_calendars:
  - name: Pack 14 Family Calendar
    url: https://api.scouting.org/advancements/events/calendar/29538
    directory: events
    layout: event-public


# Exclude from processing.
# Jekyll's built-in defaults exclude Gemfile, Gemfile.lock, node_modules,
# and vendor/. Anything listed here is added on top of those.
exclude:
  - gcalendar-key.json  # Google service account key — must NOT be published
  - CLAUDE.md           # Claude Code project instructions
  - README.md           # repo README
  - LICENSE
  - mise.toml
  - script/             # build/deploy helper scripts
  - docs/               # internal design specs and planning docs
  - pending-photos/     # real photos awaiting signed photo releases — never publish
  - .claude/
  - .github/
  - .ruby-lsp/
  - .ruby-version
  - .sass-cache/
  - .jekyll-cache/
